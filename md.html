# Prify Markdown 渲染模板

这是一段引言，演示行内样式：**粗体**、*斜体*、***粗斜体***、~~删除线~~、`行内代码`、[页内锚点](#列表)、[外部链接](https://example.com)、自动链接 <https://prify.example.com>。段落之间空一行。

> 引用块：设计的一切都围绕层级与节奏。
> > 嵌套引用同样支持。

## 文字与段落

行尾两个空格可以强制换行，  
这一行就是这么来的。转义字符 \*、\#、\[ 会原样输出，不被当作语法解析。

## 代码

围栏代码块用三个反引号包裹，标注语言即语法高亮：

```js
// 去抖：输入停顿 150ms 后再执行
function debounce(fn, ms = 150) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}
```

<script>
(function () {
  var srcEl  = document.getElementById('mdSource'),
      out    = document.getElementById('mdOut'),
      toc    = document.getElementById('mdToc'),
      nav    = document.getElementById('mdTocNav'),
      fileIn = document.getElementById('mdFile'),
      nameEl = document.getElementById('mdFileName');
  if (!srcEl || !out) return;
  var src = srcEl.textContent,
      io = null,
      SVGNS = 'http://www.w3.org/2000/svg',
      libsOK = typeof marked !== 'undefined' && typeof markedFootnote !== 'undefined' &&
               typeof hljs !== 'undefined';
  if (libsOK) marked.use(markedFootnote());   /* 脚注扩展只挂一次，重复渲染不会叠加 */

  /* 库缺失兜底：原样展示源码，页面不至于空白 */
  function fallback(text) {
    out.textContent = '';
    var pre = document.createElement('pre'),
        code = document.createElement('code');
    code.textContent = text;
    pre.appendChild(code);
    out.appendChild(pre);
    nav.textContent = '';
    toc.style.display = 'none';
  }

  /* 渲染整篇文档：初始示例与「打开 MD 文件」共用这条管线 */
  function render(text) {
    if (!libsOK) { fallback(text); return; }
    toc.style.display = '';
    var html;
    try { html = marked.parse(text); } catch (e) { fallback(text); return; }
    out.innerHTML = html;

    /* 表格外包一层横向滚动容器（窄屏不撑破布局） */
    out.querySelectorAll('table').forEach(function (t) {
      var w = document.createElement('div');
      w.className = 'md-table';
      t.replaceWith(w);
      w.appendChild(t);
    });

    /* 任务列表：markdown 的 li>input[type=checkbox] 改写成 prify 复选框（锁定只读）
       结构对齐 prify.js 的迷你任务：label.m3-check.task-item > input + span.cb>svg>use#i-check + span */
    out.querySelectorAll('li > input[type=checkbox]').forEach(function (inp) {
      var li = inp.parentNode,
          label = document.createElement('label'),
          cb = document.createElement('span'),
          svg = document.createElementNS(SVGNS, 'svg'),
          use = document.createElementNS(SVGNS, 'use'),
          text2 = document.createElement('span');
      label.className = 'm3-check task-item' + (inp.checked ? ' done' : '');
      inp.disabled = true;                       /* 只读：锁定不可改 */
      cb.className = 'cb';
      use.setAttribute('href', '#i-check');
      svg.appendChild(use);
      cb.appendChild(svg);
      while (li.firstChild) {                    /* 其余节点收进文本 span */
        var n = li.firstChild;
        li.removeChild(n);
        if (n !== inp) text2.appendChild(n);
      }
      label.appendChild(inp);
      label.appendChild(cb);
      label.appendChild(text2);
      li.appendChild(label);
    });

    /* 标题锚点 + 目录重建（每次渲染重置去重表与目录节点） */
    var seen = {};
    function slug(t) {
      var s = t.trim().toLowerCase().replace(/\s+/g, '-')
                 .replace(/[^\w\u4e00-\u9fa5-]/g, '') || 'section';
      if (seen[s] != null) { seen[s] += 1; s = s + '-' + seen[s]; } else { seen[s] = 0; }
      return s;
    }
    var heads = Array.prototype.filter.call(out.querySelectorAll('h2,h3'), function (h) {
      return !h.closest('.footnotes') && !h.classList.contains('sr-only');
    });
    nav.textContent = '';
    var frag = document.createDocumentFragment();
    heads.forEach(function (h) {
      if (!h.id) h.id = slug(h.textContent);
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = h.tagName === 'H3' ? 'depth-3' : 'depth-2';
      frag.appendChild(a);
      h._link = a;
    });
    nav.appendChild(frag);

    /* 外链一律新窗口打开 */
    out.querySelectorAll('a[href^="http"]').forEach(function (a) {
      a.target = '_blank';
      a.rel = 'noopener';
    });

    /* 语法高亮：只处理标注了语言的代码块，未标注保持原样 */
    out.querySelectorAll('pre code').forEach(function (cb) {
      var lang = '';
      Array.prototype.forEach.call(cb.classList, function (c) {
        if (c.indexOf('language-') === 0) lang = c.slice(9);
      });
      if (!lang || !hljs.getLanguage(lang)) return;
      cb.classList.add('hljs');
      try { hljs.highlightElement(cb); } catch (e) {}
    });

    /* 目录滚动高亮：重复渲染时先断开旧的 observer，只在本页写 IO，不动 prify.js */
    if (io) io.disconnect();
    io = null;
    if ('IntersectionObserver' in window && heads.length) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          nav.querySelectorAll('a.active').forEach(function (x) { x.classList.remove('active'); });
          if (en.target._link) en.target._link.classList.add('active');
        });
      }, { rootMargin: '-18% 0px -68% 0px' });
      heads.forEach(function (h) { io.observe(h); });
    }
  }

  render(src);

  /* 移动端默认收起目录；点目录跳转后顺手收起，避免遮挡正文（只绑一次） */
  if (window.matchMedia && matchMedia('(max-width:960px)').matches) toc.open = false;
  nav.addEventListener('click', function () {
    if (window.matchMedia && matchMedia('(max-width:960px)').matches) toc.open = false;
  });

  /* 打开本地 md 文件：读文本后走同一条渲染管线，轻提示 + 回到顶部 */
  if (fileIn) fileIn.addEventListener('change', function () {
    var f = fileIn.files && fileIn.files[0];
    fileIn.value = '';                      /* 清空，允许再次选同一个文件 */
    if (!f) return;
    var ok = function (text) {
      render(text);
      if (nameEl) nameEl.textContent = f.name;
      document.title = f.name + ' · Prify Markdown 渲染模板';
      if (window.scrollTo) window.scrollTo({ top: 0, behavior: 'smooth' });
      if (typeof snackbar === 'function') snackbar('已打开 ' + f.name, '知道了');
    };
    var bad = function () { if (typeof snackbar === 'function') snackbar('读取文件失败'); };
    if (f.text) f.text().then(ok, bad); else {
      var fr = new FileReader();
      fr.onload = function () { ok(String(fr.result)); };
      fr.onerror = bad;
      fr.readAsText(f);
    }
  });
})();
</script>

<!-- Snackbar：prify.js 的 snackbar() 需要这些节点，打开文件后给轻提示用 -->
<div class="snackbar" id="snackbar"><span class="sb-bar"></span><span id="sbText"></span><button id="sbAction"></button></div>

</body>
</html>
